cohort: >-
  Patients of the TCGA clear cell renal cell carcinoma project whose clinical imaging was
  contributed to The Cancer Imaging Archive: 267 of the project's 537 cases, from multiple
  institutions and scanners (mostly GE and Siemens).
tasks: []
annotations: []
annotationProvenance:
  kind: none
  note: >-
    The collection holds images only. Two separately published annotation sets cover part of
    it: BAMF's AI-generated kidney, tumour and cyst masks for 156 contrast-enhanced CT scans,
    39 of them scored by a radiologist and corrected where needed (Murugesan et al. 2024, CC BY 4.0), and
    RCC-AID's student-corrected masks for 85 CT scans, catalogued as its own dataset. Neither is
    merged into this release.
  evidence:
    sources: [tcia-tcga-kirc, bamf-aimi-paper, rcc-aid-paper]
    locator: TCIA analysis-results listing; BAMF paper, CT kidneys, tumors and cysts annotation; RCC-AID Table 2
    status: verified
    verifiedOn: 2026-09-26
features:
  wsi:
    status: not_applicable
    note: Slides for these patients are in the GDC open-access release of this dataset.
  ctPhases:
    status: not_documented
    note: >-
      Scans span several contrast phases, but the collection does not label them in a
      structured way: the RCC-AID authors report that the TCGA metadata does not give clear
      phase information, and had a radiologist label phases for the scans they annotated.
    evidence:
      sources: [rcc-aid-paper]
      locator: Section 5.2.2, annotation protocol
      status: verified
      verifiedOn: 2026-09-26
  clinicalData:
    status: absent
    note: The archive states that clinical and genomic data are held in the GDC, not in this collection. They join by TCGA barcode.
    evidence:
      sources: [tcia-tcga-kirc]
      status: verified
      verifiedOn: 2026-09-26
  followUp:
    status: absent
    note: Follow-up is in the GDC clinical records, not in this collection.
