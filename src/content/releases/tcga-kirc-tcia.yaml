deidentification:
  statement: >-
    The collection page describes the images as de-identified, with DICOM dates offset by 3 to
    10 years so that intervals between studies are kept.
  status: present
  evidence:
    sources: [tcia-tcga-kirc]
    locator: Collection page, date-offset note
    status: verified
    verifiedOn: 2026-09-26
pairing:
  - kind: same_patient
    modalities: [ct, pathology, clinical_table]
    status: present
    note: >-
      Every one of the 267 imaging patients is a case in the GDC open-access release of
      TCGA-KIRC: the archive's PatientID is the TCGA barcode (the GDC's submitter_id). 237
      patients with CT also have slide images there.
    evidence:
      sources: [tcia-tcga-kirc-series, gdc-kirc-case-records, gdc-kirc-slide-files]
      locator: PatientID values matched against GDC case submitter_id values
      status: verified
      verifiedOn: 2026-09-26
  - kind: follow_up
    modalities: [ct, mri]
    status: present
    note: 439 studies for 267 patients, so some patients have more than one imaging date; the RCC-AID authors kept only each patient's first study date to reduce post-surgery scans.
    evidence:
      sources: [tcia-tcga-kirc-series, rcc-aid-paper]
      locator: StudyInstanceUID per PatientID; RCC-AID section 5.2.1
      status: verified
      verifiedOn: 2026-09-26
dictionary:
  completeness: documentation_only
  inspectedScope: >-
    The series-level fields returned by the TCIA API (PatientID, modality, manufacturer, series
    description, image count, licence). No DICOM header was read, so acquisition parameters and
    contrast phases are not recorded. The clinical dictionary is on the GDC release.
structure: >-
  DICOM organised as patient, study and series. The PatientID is the TCGA barcode, which joins
  each patient to the clinical records and slides in the GDC. Series include localisers,
  reconstructions and MR sequences as well as diagnostic CT, so a study that needs one CT
  volume per patient must choose a series; series descriptions are free text.
citation: >-
  Akin O, et al. The Cancer Genome Atlas Kidney Renal Clear Cell Carcinoma
  Collection (TCGA-KIRC) (Version 3) [Data set]. The Cancer Imaging Archive, 2016.
  doi:10.7937/K9/TCIA.2016.V6PBVTDR
limitations:
  - Covers 267 of the 537 TCGA-KIRC cases; the rest have no imaging here.
  - Mixed modalities and many series per study; contrast phase is not labelled in a structured field.
  - No masks are part of the collection. The BAMF masks were produced by a model trained partly on TCGA-KIRC cases, so they are not independent of this collection.
  - Scans come from many institutions with differing protocols and slice thicknesses.
