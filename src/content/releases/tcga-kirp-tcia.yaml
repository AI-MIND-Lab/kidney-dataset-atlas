cohort: >-
  Patients of the TCGA papillary renal cell carcinoma project whose clinical imaging was
  contributed to The Cancer Imaging Archive: 33 of the project's 291 cases. The archive states
  that all baseline imaging studies are pre-surgical.
tasks: []
annotations: []
annotationProvenance:
  kind: none
  note: >-
    The collection holds images only. RCC-AID, catalogued as its own dataset, adds
    student-corrected kidney, tumour and cyst masks for 26 CT scans from this collection. BAMF's
    AIMI annotation record (version 2.x) adds AI masks for 18 scans of 11 patients from this
    collection; a radiologist scored 1 of them, and the rest are uncorrected AI output.
  evidence:
    sources: [rcc-aid-paper, bamf-aimi-zenodo]
    locator: RCC-AID Table 2; BAMF Zenodo record v2.0.2, kidney-ct.zip, qa-results.csv (Collection tcga_kirp)
    status: verified
    verifiedOn: 2026-09-26
features:
  wsi:
    status: not_applicable
    note: Slides for these patients are in the GDC open-access release of this dataset.
  ctPhases:
    status: not_documented
    note: >-
      Contrast phases are not labelled in a structured field; the RCC-AID authors had a
      radiologist label phases for the scans they annotated.
    evidence:
      sources: [rcc-aid-paper]
      locator: Section 5.2.2, annotation protocol
      status: verified
      verifiedOn: 2026-09-26
  clinicalData:
    status: present
    note: >-
      The collection page offers TCGA clinical spreadsheets taken from the GDC (TCGA-KIRP-Clinical-Data.zip);
      its patient file covers 31 of the 33 imaging patients. The full, current clinical records are the GDC's, joined by
      TCGA barcode.
    evidence:
      sources: [tcia-tcga-kirp]
      locator: Collection page, Detailed Description ("Below is a snapshot of clinical data…") and Version note; TCGA-KIRP-Clinical-Data.zip, clinical_patient file
      status: verified
      verifiedOn: 2026-10-09
  followUp:
    status: present
    note: >-
      The clinical spreadsheets on the collection page include a follow-up file covering 25 of the 33 imaging patients;
      the GDC's follow-up records are more complete.
    evidence:
      sources: [tcia-tcga-kirp]
      locator: TCGA-KIRP-Clinical-Data.zip, clinical_follow_up file
      status: verified
      verifiedOn: 2026-10-09
access:
  mode: direct_open_download
  registrationVisible: false
  instructions: >-
    Download from the collection page with the TCIA Data Retriever, or query the TCIA API. The
    images are also mirrored in NCI's Imaging Data Commons.
  evidence:
    sources: [tcia-tcga-kirp]
    status: verified
    verifiedOn: 2026-09-26
license:
  name: CC BY 3.0
  url: https://creativecommons.org/licenses/by/3.0/
  conditions: >-
    Attribution: cite the collection (Linehan et al. 2016, doi:10.7937/K9/TCIA.2016.ACWOGBEF)
    and The Cancer Imaging Archive. The series list gives the same licence for every series.
deidentification:
  statement: >-
    The collection page states that DICOM dates are offset by 3 to 10 years for HIPAA
    compliance, keeping the intervals between studies.
  status: present
  evidence:
    sources: [tcia-tcga-kirp]
    locator: Collection page, date-offset note
    status: verified
    verifiedOn: 2026-09-26
pairing:
  - kind: same_patient
    modalities: [ct, pathology, clinical_table]
    status: present
    note: >-
      All 33 imaging patients are cases in the GDC open-access release of TCGA-KIRP: the
      archive's PatientID is the TCGA barcode. 23 patients with CT also have slide images there.
    evidence:
      sources: [tcia-tcga-kirp-series, gdc-kirp-case-records, gdc-kirp-slide-files]
      locator: PatientID values matched against GDC case submitter_id values
      status: verified
      verifiedOn: 2026-09-26
  - kind: follow_up
    modalities: [ct, mri]
    status: present
    note: 47 studies for 33 patients, so some patients have more than one imaging date.
    evidence:
      sources: [tcia-tcga-kirp-series]
      locator: StudyInstanceUID per PatientID
      status: verified
      verifiedOn: 2026-09-26
dictionary:
  completeness: documentation_only
  inspectedScope: >-
    The series-level fields returned by the TCIA API (PatientID, modality, manufacturer, series
    description, image count, licence). No DICOM header was read. The clinical dictionary is on
    the GDC release.
structure: >-
  DICOM organised as patient, study and series. The PatientID is the TCGA barcode, which joins
  each patient to the clinical records and slides in the GDC. Most series are MR; 89 series
  have no body part recorded. A study that needs one CT volume per patient must choose a series.
citation: >-
  Linehan M, Gautam R, Kirk S, et al. The Cancer Genome Atlas Cervical Kidney Renal Papillary
  Cell Carcinoma Collection (TCGA-KIRP) (Version 4) [Data set]. The Cancer Imaging Archive,
  2016. doi:10.7937/K9/TCIA.2016.ACWOGBEF
limitations:
  - Covers 33 of the 291 TCGA-KIRP cases, and only 23 of them have CT.
  - The collection's official title includes the word "Cervical", although it is the papillary kidney cancer collection.
  - Mixed modalities and many series per study; contrast phase is not labelled in a structured field.
  - No masks are part of the collection.
