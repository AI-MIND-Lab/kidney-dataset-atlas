      status: verified
      verifiedOn: 2026-09-21
dictionary:
  completeness: documentation_only
  inspectedScope: >-
    Collection-level identifiers, relative-time handling, image formats and modality-specific
    counts from the Version 14 page. No image manifest, DICOM object, slide or external clinical
    table was downloaded for this record.
structure: >-
  Radiology is distributed as DICOM studies and series; pathology is distributed as SVS
  whole-slide images. A shared project Patient ID links modalities and external CPTAC records.
  DICOM Clinical Trial Time Point ID expresses days before or after pathological diagnosis.
citation: >-
  National Cancer Institute Clinical Proteomic Tumor Analysis Consortium (CPTAC). The Clinical
  Proteomic Tumor Analysis Consortium Clear Cell Renal Cell Carcinoma Collection (CPTAC-CCRCC),
  Version 14. The Cancer Imaging Archive, 2018. doi:10.7937/K9/TCIA.2018.OBLAMN27.
limitations:
  - The collection is ongoing, so counts and contents may change after Version 14.
  - Radiology, pathology and linked molecular-data availability differ by subject; 65 and 222 are overlapping modality-specific subject counts, not additive cohorts.
  - Version 14 contains a separately identified non-CCRCC/rare-kidney-tumor component; filter it for a pure clear-cell cohort.
  - CT and MRI acquisition protocols are heterogeneous across sites and time points.
  - Tumor annotations are a separate derived analysis result for 60 subjects, not labels covering the base collection.
  - Linked GDC and PDC records are external to this imaging release and may include controlled-access files.
