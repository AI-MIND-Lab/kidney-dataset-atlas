access:
  mode: direct_open_download
  registrationVisible: false
  instructions: >-
    Use the Version 14 download manifests on TCIA. Radiology downloads require the free NBIA Data
    Retriever, while the pathology package uses the collection's current bulk-download route.
    Linked proteomic, genomic and clinical data live in PDC and GDC and may have separate access tiers.
  evidence:
    sources: [cptac-ccrcc-tcia]
    locator: Version 14 Data Access
    status: verified
    verifiedOn: 2026-09-21
license:
  name: CC BY 4.0
  url: https://creativecommons.org/licenses/by/4.0/
  conditions: >-
    Attribution, the dataset DOI and TCIA's required data citation are required. CPTAC also
    requests its program acknowledgement. External GDC or PDC files retain their own access rules.
deidentification:
  statement: >-
    TCIA uses deidentified project Patient IDs. DICOM dates are shifted by a consistent,
    site-specific random offset while intervals are preserved; Clinical Trial Time Point ID stores
    days relative to pathological diagnosis.
  status: present
  evidence:
    sources: [cptac-ccrcc-tcia]
    locator: A Note about TCIA and CPTAC Subject Identifiers and Dates
    status: verified
    verifiedOn: 2026-09-21
pairing:
  - kind: same_patient
    modalities: [ct, mri, pathology, clinical_table, molecular]
    status: present
    note: >-
      The same deidentified project Patient ID is used across TCIA imaging and linked CPTAC clinical,
      proteomic and genomic systems. Availability is sparse by modality and does not mean every
      subject has every data type.
    evidence:
      sources: [cptac-ccrcc-tcia]
      locator: Subject Identifiers
      status: verified
      verifiedOn: 2026-09-21
  - kind: follow_up
    modalities: [ct, mri]
    status: present
    note: Follow-up radiology exists where available; time intervals are preserved after date shifting.
    evidence:
