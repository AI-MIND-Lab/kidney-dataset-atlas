annotationProvenance:
  kind: none
  note: >-
    The base collection has no tumor masks. A separately versioned TCIA analysis result supplies
    radiology annotations for a 60-subject subset and is not merged into this release record.
  evidence:
    sources: [cptac-ccrcc-tcia, cptac-ccrcc-annotations]
    status: verified
    verifiedOn: 2026-09-21
