cohort: >-
  The CPTAC clear-cell renal cell carcinoma imaging cohort, with an additional small
  non-CCRCC/rare-kidney-tumor imaging component in Version 14. Radiology was collected around
  pathological diagnosis and at follow-up where available; pathology images come from the CPTAC
  qualification workflow.
