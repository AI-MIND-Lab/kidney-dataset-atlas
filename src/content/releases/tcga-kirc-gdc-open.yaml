access:
  mode: direct_open_download
  registrationVisible: false
  instructions: >-
    Open-access files — clinical, biospecimen and slide images — download from the GDC Data
    Portal or API without authorisation. Controlled-access files such as low-level sequencing
    and germline variants require dbGaP authorisation and are not part of this record.
  evidence:
    sources: [gdc-access-processes]
    locator: Open access and controlled access definitions
    status: verified
    verifiedOn: 2026-09-19
license:
  name: NCI Genomic Data Commons open-access tier
  url: https://gdc.cancer.gov/access-data/data-access-processes-and-tools
  conditions: >-
    Open-access data are downloadable without authorisation. Publication and citation
    guidance from NCI applies. The controlled-access tier carries separate obligations and is
    excluded here.
deidentification:
  statement: >-
    The GDC describes open-access data as "high level genomic data that is not individually
    identifiable, as well as most clinical and all biospecimen data elements", and places
    individually identifiable data in the controlled tier.
  status: present
  evidence:
    sources: [gdc-access-processes]
    locator: Open access definition
    status: verified
    verifiedOn: 2026-09-19
pairing:
  - kind: same_patient
    modalities: [ct, pathology]
    status: not_verified
    note: >-
      The Cancer Imaging Archive hosts a TCGA-KIRC radiology collection. Whether those images
      correspond to these cases was not checked for this record, so no pairing is claimed.
  - kind: same_patient
    modalities: [pathology, clinical_table]
    status: present
    note: Slide images and clinical records attach to the same case barcode.
    evidence:
      sources: [gdc-kirc-case-fields]
      status: verified
      verifiedOn: 2026-09-19
dictionary:
  completeness: partial
  inspectedScope: >-
    Eight case-level fields returned by the GDC API for this project were documented. The full
    GDC clinical dictionary holds many more fields, and the biospecimen and slide metadata were
    not documented here.
structure: >-
  A case is a patient, identified by a TCGA barcode such as TCGA-B0-5098. Clinical, biospecimen
  and slide-image files attach to the case. A case may carry several diagnoses and several
  follow-up records, so a case-level analysis must decide how to collapse them.
citation: The Cancer Genome Atlas Research Network, TCGA-KIRC project, NCI Genomic Data Commons.
limitations:
  - Covers the open-access tier only; controlled-access molecular data need dbGaP authorisation.
  - No expert image annotations, such as tumour outlines on slides, are documented in this record.
  - Slide image counts are file counts, which are not necessarily distinct physical slides.
  - Cases may have several diagnosis records, so counting diagnoses is not the same as counting patients.
