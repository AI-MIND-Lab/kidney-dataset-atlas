annotationProvenance:
  kind: not_documented
  note: >-
    The labels are clinical record fields submitted for each case: the pathological diagnosis, grade and
    stage, and vital status with follow-up (see the data dictionary). The sources read do not say who
    assigned them. No image annotations, such as tumour outlines on slides, are part of this open-access tier.
features:
  wsi:
    status: present
    note: 2,173 slide image files in SVS format, all open access.
    evidence:
      sources: [gdc-kirc-slides]
      status: verified
      verifiedOn: 2026-09-19
  ctPhases:
    status: not_applicable
    note: The GDC release holds no radiology. CT and MR for 267 of these patients are in the TCIA collection, catalogued as a separate release of this dataset.
  clinicalData:
    status: present
    note: Clinical files cover all 537 cases.
    evidence:
      sources: [gdc-kirc-summary]
      status: verified
      verifiedOn: 2026-09-19
  followUp:
    status: present
    note: Follow-up records with days_to_follow_up are returned for cases; the number of follow-ups varies per case.
    evidence:
      sources: [gdc-kirc-case-fields]
      status: verified
      verifiedOn: 2026-09-19
access:
  mode: direct_open_download
  registrationVisible: false
  instructions: >-
    Open-access files — clinical, biospecimen and slide images — download from the GDC Data
    Portal or API without authorisation. Controlled-access files such as low-level sequencing
    and germline variants require dbGaP authorisation and are not part of this record.
  evidence:
    sources: [gdc-access-processes]
    locator: Open access and controlled access definitions
    status: verified
    verifiedOn: 2026-09-19
license:
  name: NCI Genomic Data Commons open-access tier
  url: https://gdc.cancer.gov/access-data/data-access-processes-and-tools
  conditions: >-
    Open-access data are downloadable without authorisation. Publication and citation
    guidance from NCI applies. The controlled-access tier carries separate obligations and is
    excluded here.
deidentification:
  statement: >-
    The GDC describes open-access data as "high level genomic data that is not individually
    identifiable, as well as most clinical and all biospecimen data elements", and places
    individually identifiable data in the controlled tier.
  status: present
  evidence:
    sources: [gdc-access-processes]
    locator: Open access definition
    status: verified
    verifiedOn: 2026-09-19
pairing:
  - kind: same_patient
    modalities: [ct, mri, pathology]
    status: present
    note: >-
      267 of the 537 cases also have radiology in The Cancer Imaging Archive's TCGA-KIRC
      collection, catalogued as a separate release of this dataset. The archive's PatientID is
      the TCGA barcode, and every imaging patient matched a case here; 237 have CT.
    evidence:
      sources: [tcia-tcga-kirc-series, gdc-kirc-case-records]
      locator: TCIA PatientID matched against GDC submitter_id
      status: verified
      verifiedOn: 2026-09-26
  - kind: same_patient
    modalities: [pathology, clinical_table]
    status: present
    note: Slide images and clinical records attach to the same case barcode.
    evidence:
      sources: [gdc-kirc-case-fields]
      status: verified
      verifiedOn: 2026-09-19
dictionary:
  completeness: complete_for_inspected_release
  inspectedScope: >-
    Every clinical property the GDC API returns with a real value for at least one of the
    537 cases (case, demographic, diagnosis, pathology detail, treatment, exposure, follow-up
    and laboratory-test entities), plus the slide-image file, sample and slide fields: 91
    variables, from GDC Data Release 46.0. Definitions are the GDC data dictionary's; counts and
    codes are observed. Properties holding only "Not Reported"-style markers are left out.
    Biospecimen records beyond the slides, and the controlled-access tier, are not covered.
structure: >-
  A case is a patient, identified by a TCGA barcode such as TCGA-B0-5098. Clinical, biospecimen
  and slide-image files attach to the case. A case may carry several diagnoses and several
  follow-up records, so a case-level analysis must decide how to collapse them.
citation: The Cancer Genome Atlas Research Network, TCGA-KIRC project, NCI Genomic Data Commons.
limitations:
  - Covers the open-access tier only; controlled-access molecular data need dbGaP authorisation.
  - No expert image annotations, such as tumour outlines on slides, are documented in this record.
  - Slide image counts are file counts, which are not necessarily distinct physical slides.
  - Cases may have several diagnosis records, so counting diagnoses is not the same as counting patients.
eligibility:
  publicAccess:
    status: pass
    note: Open-access files download without authorisation; the controlled tier is excluded from this record.
    evidence:
      sources: [gdc-access-processes]
      status: verified
      verifiedOn: 2026-09-19
  deidentification:
    status: pass
    note: The provider states that open-access data are not individually identifiable.
    evidence:
      sources: [gdc-access-processes]
      status: verified
      verifiedOn: 2026-09-19
  noPhiHosted:
    status: pass
  termsPermitUse:
    status: pass
    note: >-
      The provider publishes this tier for download without authorisation, and this record
      holds descriptions and sources only: no data file is mirrored here.
    evidence:
      sources: [gdc-access-processes]
      locator: Open access definition and download conditions
      status: verified
      verifiedOn: 2026-09-21
  samplePermission:
    status: pass
    note: No preview images are shown for this release, so no per-image permission was needed.
