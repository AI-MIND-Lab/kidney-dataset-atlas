    status: not_documented
dictionary:
  completeness: partial
  inspectedScope: >-
    The repository's description of each case directory. The label numbering is recorded from
    the KiTS23 configuration file, which uses the same three classes; it was not separately
    confirmed for this edition.
structure: >-
  Each case directory holds imaging.nii.gz, a raw directory, a segmentations directory with
  every individual annotation instance named by region, instance and annotation number, and
  three aggregated segmentations built by union, intersection and majority vote. Which
  aggregation a study used changes what its numbers mean.
citation: >-
  Heller N, Isensee F, Trofimova D, et al. The KiTS21 Challenge: Automatic segmentation of
  kidneys, renal tumors, and renal cysts in corticomedullary-phase CT. arXiv:2307.01984, 2023.
limitations:
  - The 100-case test set is not public.
  - Roughly a 2:1 male-to-female imbalance is reported in the cohort.
  - The training cohort is drawn largely from a single academic centre and is predominantly Caucasian.
  - Three aggregated segmentations are distributed; results depend on which one is used.
  - The data licence is not stated in the repository.
