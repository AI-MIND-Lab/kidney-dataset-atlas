dictionary:
  completeness: partial
  inspectedScope: >-
    The published codebooks for ALB_CR_L and BIOPRO_L. Every ALB_CR_L variable is documented;
    for BIOPRO_L only the kidney-relevant analytes are. Other files in the cycle, including
    demographics and the survey design variables, are not documented here.
structure: >-
  Two SAS transport tables, one row per participant, joined to each other and to the rest of
  the cycle by SEQN. Weighted analysis additionally needs SDMVSTRA and SDMVPSU from the
  demographics file of the same cycle.
citation: >-
  National Center for Health Statistics, National Health and Nutrition Examination Survey,
  August 2021–August 2023 public-use data files.
limitations:
  - Survey participants, not a clinical cohort, and not a kidney disease cohort.
  - "Cross-sectional: the cycle gives one measurement occasion per participant."
  - The urine albumin method changed to LC-MS/MS; results average 6.20% higher than the previous immunoassay, and the provider supplies regression equations for comparability.
  - Estimates require the survey design variables and weights, which are in a file outside this record.
  - Serum creatinine here is not a reference-method measurement for clinical decisions about renal function.
