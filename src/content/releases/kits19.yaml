id: kits19
dataset: kits
versionLabel: KiTS19
current: false
releaseDate: null
counts:
  patients:
    value: 210
    status: present
    evidence:
      sources: [kits19-data-paper]
      locator: 300 patients in total, of which 210 are public and 90 were held back for testing
      status: verified
      verifiedOn: 2026-09-20
      note: The publicly released cases. The 90 test cases were withheld and are not counted here.
  examinations:
    value: null
    status: not_documented
  lesions:
    value: null
    status: not_documented
  slices:
    value: null
    status: not_documented
  slides:
    value: null
    status: not_applicable
