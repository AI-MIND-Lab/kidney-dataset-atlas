    value: null
    status: not_documented
modalities:
  - ct
cohort: >-
  Patients who underwent partial or radical nephrectomy for kidney tumours at the University
  of Minnesota between 2010 and mid-2018, identified by retrospective chart review.
tasks:
  - segmentation
annotations:
  - segmentation_masks
annotationProvenance:
  kind: trainee
  note: >-
    Medical students drew freehand kidney and tumour contours in the transverse plane with a web
    tool, under the supervision of a fellowship-trained urologic oncologist; a reviewing student
    then checked every image and label pair and fixed or returned cases with problems.
  evidence:
    sources: [kits19-data-paper]
    locator: Sections 2 and 2.3, CT Annotation
    status: verified
    verifiedOn: 2026-09-23
features:
  wsi:
    status: not_applicable
  ctPhases:
    status: present
    phases: [late arterial]
    note: >-
      Each case uses the most recent preoperative CT study with at least one late arterial
      series covering the whole abdomen; where several qualified, the late arterial series with the
      smallest slice thickness was preferred.
    evidence:
      sources: [kits19-data-paper]
      locator: Section 2.2, CT Collection
      status: verified
      verifiedOn: 2026-09-23
  clinicalData:
    status: present
    note: >-
      The data paper describes demographics, comorbidities, surgical details, complications,
      pathology staging and post-operative outcomes including eGFR, distributed as kits.json.
    evidence:
      sources: [kits19-data-paper, kits19-repo]
      status: verified
      verifiedOn: 2026-09-20
  followUp:
    status: present
    note: The data paper describes post-operative outcomes including vital status.
    evidence:
      sources: [kits19-data-paper]
      status: verified
      verifiedOn: 2026-09-20
access:
  mode: direct_open_download
  registrationVisible: false
  instructions: >-
    Clone the kits19 repository, which carries the segmentations and kits.json, then run
    get_imaging.py to fetch the imaging volumes. No registration or application is required.
  evidence:
    sources: [kits19-repo]
    locator: Download instructions
    status: verified
    verifiedOn: 2026-09-20
license:
  name: Not documented for the data
  conditions: >-
    The repository's LICENSE file grants MIT terms to everything "EXCEPT that within the data/
    subdirectory", and states no terms for the data itself. The TCIA archive of the same
    training cases is published under CC BY 3.0; that is a different release, recorded
    separately.
deidentification:
  statement: >-
    The data paper documents institutional review board approval (University of Minnesota
    study 1611M00821) and retrospective chart review. No description of the de-identification
    procedure was found in the version read.
  status: not_documented
  evidence:
    sources: [kits19-data-paper]
    locator: "\"This work was reviewed and approved by the Institutional Review Board at the University of Minnesota as Study 1611M00821.\""
    status: verified
    verifiedOn: 2026-09-20
pairing:
  - kind: same_patient
    modalities: [ct, clinical_table]
    status: present
    note: Clinical records in kits.json are keyed to the same case numbers as the imaging.
    evidence:
      sources: [kits19-repo, kits19-data-paper]
      status: verified
      verifiedOn: 2026-09-20
dictionary:
  completeness: complete_for_inspected_release
  inspectedScope: >-
    data/kits.json at commit 67e495d (all 210 public cases, 63 fields), read field by field, and
    the segmentation label values in the README. Meanings come from section 3 of the data paper;
    observed values, types and missing counts come from the file. The imaging volumes themselves
    were not downloaded.
structure: >-
  Each case directory holds imaging.nii.gz and segmentation.nii.gz, with labels 0 background,
  1 kidney and 2 tumour. Voxel spacing is carried in each volume's affine matrix and varies
  between cases, because scans came from many referring institutions. A kits.json file at the
  root of the data directory holds the clinical records.
citation: >-
  Heller N, Sathianathen N, Kalapara A, et al. The KiTS19 Challenge Data: 300 Kidney Tumor
  Cases with Clinical Context, CT Semantic Segmentations, and Surgical Outcomes.
  arXiv:1904.00445, 2019.
limitations:
  - Only 210 of the 300 cases are public; 90 were withheld for challenge testing.
  - "Two segmentation classes only: kidney and tumour, with no cyst class."
  - Scanners and protocols vary, because many scans were acquired at referring institutions.
  - The data licence is not stated in the repository.
eligibility:
  publicAccess:
    status: pass
    note: The 210 public cases download without registration or application.
    evidence:
      sources: [kits19-repo]
      status: verified
      verifiedOn: 2026-09-20
  deidentification:
    status: unknown
    note: Review board approval is documented; the de-identification procedure is not. Same open question as KiTS23.
    evidence:
      sources: [kits19-data-paper]
      status: not_verified
  noPhiHosted:
    status: pass
  termsPermitUse:
    status: unknown
    note: >-
      The repository states no licence for the data, so the terms under which this catalog may
      describe or show it are not established.
    evidence:
      sources: [kits19-license]
      status: verified
      verifiedOn: 2026-09-20
  samplePermission:
    status: pass
    note: No preview images are shown for this release.
