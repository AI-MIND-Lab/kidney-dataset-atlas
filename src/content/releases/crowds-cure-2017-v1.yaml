annotationProvenance:
  kind: crowd
  note: >-
    Attendees of the RSNA 2017 meeting, asked to make "a uni-dimensional measurement of the
    largest lesion". Each row records whether its author was a radiologist: of the 1,282 kidney
    measurements, 770 are by 41 people marked radiologist and 512 by 27 marked not radiologist.
    The application had no option for image quality, lesion location or lesion
    characteristics, which the provider says required "additional post-collection image
    review"; no such review is part of this release.
  evidence:
    sources: [tcia-crowds-cure-2018, tcia-crowds-cure-2017-csv]
    locator: Crowds-Cure-2018 summary; radiologist_status and annotator columns
    status: verified
    verifiedOn: 2026-10-09
