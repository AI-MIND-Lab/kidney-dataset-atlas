cohort: >-
  CT scans of 159 TCGA-KIRC patients from The Cancer Imaging Archive, one study each, shown to
  attendees of the RSNA 2017 annual meeting together with scans from TCGA-LUAD, TCGA-LIHC and
  TCGA-OV. How the scans were chosen is not documented.
