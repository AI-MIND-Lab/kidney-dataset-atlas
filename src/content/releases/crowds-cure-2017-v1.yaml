dictionary:
  completeness: complete_for_inspected_release
  inspectedScope: >-
    CrowdsCureCancer2017Annotations.csv (all 20 columns; the 1,282 kidney rows profiled) and
    ccc2017clinical.csv (all 17 columns; the 159 TCGA-KIRC rows profiled). The DICOM structured
    reports were counted, not parsed, and no image was downloaded.
structure: >-
  CrowdsCureCancer2017Annotations.csv has one row per measurement: the patient (patientID, a TCGA
  barcode); the study, series and image measured (StudyInstanceUID, seriesUID, instanceUID,
  sliceIndex); the line's end points (start_x, start_y, end_x, end_y) and its length; the
  annotator's nickname and radiologist_status; and when it was drawn (date, date_unix). anatomy
  is Renal for exactly the TCGA-KIRC patients. The structured-report ZIP holds 2,334 files for
  the 2,345 measurements. ccc2017clinical.csv has one GDC clinical row per patient, keyed by
  Patient ID, with "--" for a missing value.
citation: >-
  Kalpathy-Cramer J, Beers A, Mamonov A, Ziegler E, Lewis R, Almeida AB, Harris G, Pieper S,
  Sharma A, Tarbox L, Tobler J, Prior F, Flanders A, Dulkowski J, Fevrier-Sullivan B, Jaffe C,
  Freymann J, Kirby J. (2019). Crowds Cure Cancer: Crowdsourced data collected at the RSNA 2017
  annual meeting [Data set]. The Cancer Imaging Archive. doi:10.7937/K9/TCIA.2018.OW73VLO2
limitations:
  - Single lines on one slice, not masks or volumes; the units of the length and end-point columns are not stated.
  - No lesion location was recorded, so a measurement need not be of the kidney tumour, and the provider's later image review is not released.
  - Drawn by meeting attendees; 512 of the 1,282 kidney measurements are by people marked not radiologists, and the only documented instruction is to measure the largest lesion.
  - Repeated measurements of the same patients (a median of 6, up to 18), and 74 patients have measurements on more than one series; splits must be made by patient.
  - How the 159 patients were chosen is not documented, and the page lists no publication by the dataset's authors.
  - Not independent of TCGA-KIRC; its counts must not be added to the collection's.
