deidentification:
  statement: >-
    The Cancer Imaging Archive describes itself as "a service which de-identifies and hosts" cancer
    images. Patients appear by TCGA barcode and annotators by nicknames such as misty_mandrill. The
    measurement file repeats each study's DICOM StudyDate and StudyTime, which for TCGA-KIRC are
    the collection's offset dates, and the clinical snapshot gives years of birth and death from
    the GDC.
  status: present
  evidence:
    sources: [tcia-crowds-cure-2017, tcia-crowds-cure-2017-csv, tcia-crowds-cure-2017-clinical, tcia-tcga-kirc]
    locator: Page footer, About the Cancer Imaging Archive; CSV columns; TCGA-KIRC collection page, date-offset note
    status: verified
    verifiedOn: 2026-10-09
