license:
  name: CC BY 4.0 (masks); CC BY 3.0 (images and metadata, from TCIA)
  url: https://creativecommons.org/licenses/by/4.0/
  conditions: >-
    The segmentation masks are CC BY 4.0. The NIfTI images and metadata.csv are derived from the
    TCIA TCGA collections and remain under their CC BY 3.0 licence. Commercial use is allowed.
    Cite the RCC-AID paper and the three TCIA collections, and include the TCGA acknowledgement.
    The code is MIT-licensed.
