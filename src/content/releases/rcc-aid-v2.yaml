  inspectedScope: >-
    The label map and file layout from the Zenodo record, and the metadata.csv columns that the
    authors' analysis code reads (PatientID, SeriesInstanceUID, PatientSex, PatientAge). The
    record could not be downloaded (Zenodo refused automated requests), so the remaining
