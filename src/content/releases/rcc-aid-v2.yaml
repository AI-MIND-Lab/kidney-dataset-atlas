annotationProvenance:
  kind: mixed
  note: >-
    A public nnU-Net model (de Boer et al. 2026) drew initial kidney and renal-mass masks. Two
    students trained for the task, without full medical training, corrected obvious errors and
    clicked the primary tumour and any cysts, and unselected masks were deleted. 31 of 283
    series were referred to a board-certified radiologist (6 years' abdominal experience); 16
    were resolved and 15 excluded. A second radiologist (3 years) labelled contrast phases.
    Unidentified lesions were not searched for, and inter-observer variability was not measured.
  evidence:
    sources: [rcc-aid-paper]
    locator: Sections 5.2.2 to 5.2.4
    status: verified
    verifiedOn: 2026-09-26
