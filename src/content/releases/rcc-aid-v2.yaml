dictionary:
  completeness: partial
  inspectedScope: >-
    The Zenodo label map and file layout, the authors' analysis code, and all 41 columns
    across 129 series records in version-2.0.0 metadata.csv (inspected 2026-10-08).
    Clinical field meanings are not fully documented; imaging volumes and masks were
    not inspected.
structure: >-
  images/ holds one NIfTI CT volume per scan and labels/ one matching mask (file name plus
  _seg). File names begin with the collection code (KIRC, KIRP or KICH), which gives the
  subtype, followed by the TCIA series UID. Masks label 0 background, 1 kidney, 2 tumour and
  3 cyst. metadata.csv links each scan to its TCIA series and TCGA patient.
citation: >-
  de Boer S, Häntze H, Ziegelmayer S, Russo T, van Ginneken B, Prokop M, Bressem K, Hering A.
  RCC-AID: Renal Cell Carcinoma AI Dataset for Medical Imaging Research. Machine Learning for
  Biomedical Imaging, 2026:772-782. doi:10.59275/j.melba.2026-2dg2. Cite also the TCIA
  TCGA-KIRC, TCGA-KIRP and TCGA-KICH collections.
limitations:
  - Masks start from a model's output and were corrected by trained students, with a radiologist only for uncertain cases; no inter-observer study.
  - Only the primary solid tumour and cysts are labelled; scans with several solid tumours were excluded and missed lesions were not searched for.
  - Clear cell cases are a random 200 of 676 eligible series before exclusions; papillary (26 scans) and chromophobe (18) are small.
  - Predominantly male (67 of 91) and from North American academic centres.
  - Not independent of the TCGA collections, and version 1.0.0 (142 scans) differs; results must name the version.
  - Slice thickness ranges from 0.6 to 5.0 mm across scanners.
