cohort: >-
  Contrast-enhanced CT scans from the TCGA-KIRC, TCGA-KIRP and TCGA-KICH collections on The
  Cancer Imaging Archive, each with exactly one solid primary renal tumour. All papillary and
  chromophobe candidates were annotated, and a random 200 of 676 eligible clear cell series;
  scans of the chest, post-operative scans, scans without contrast and scans with several solid
  tumours were excluded.
