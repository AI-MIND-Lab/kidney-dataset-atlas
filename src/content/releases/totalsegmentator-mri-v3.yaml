structure: >-
  A single archive of about 15 GB, holding MR images with their segmentation masks. Both
  kidneys are among the segmented structures; the full list of 50 regions travels with the archive.
citation: >-
  Akinci D'Antonoli T, et al. TotalSegmentator MRI: Robust Sequence-independent Segmentation
  of Multiple Anatomic Structures in MRI. Radiology, 2025. The paper was not read for this
  record; cite the dataset version DOI separately.
limitations:
  - An anatomical dataset, not a kidney disease cohort; kidney labels are outlines, not diagnoses.
  - Sequences are deliberately mixed, so results are not attributable to one protocol.
  - Images are counted, not subjects, so the size of the cohort is unknown.
  - The paper describing this collection was not read for this record; only the archive record was.
  - The archive is about 15 GB.
