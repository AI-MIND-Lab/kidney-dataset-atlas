modalities:
  - ct
  - other
cohort: >-
  CT scans taken from 17 public datasets (FLARE'23, KiTS'23, LiTS, TCIA-Pancreas-CT, CT-ORG, RSNA 2023 Abdominal
  Trauma Detection, BTCV, CHAOS, AbdomenCT-1K, six Medical Segmentation Decathlon CT tasks, WORD and AMOS), from 138
  institutions in 19 countries according to the paper's Table 1. The same CT scans form AbdomenAtlas 1.1. No
  inclusion criteria beyond membership of those datasets are stated. The "other" modality is the report text:
  structured and narrative reports for 9,261 scans, and enhanced reports that merge in human notes for 117.
