structure: >-
  Each case is a folder named by its BDMAP ID. It holds ct.nii.gz and a segmentations folder with one NIfTI mask per
  structure: 43 files in most cases, 44 when a colon lesion mask is present. The files are packed in 40 image tarballs
  and 40 mask tarballs, each covering a range of IDs. The masks are separate files and can overlap: among the first 232 cases,
  55 of the 78 with a kidney lesion have at least 95% of the lesion inside the kidney masks. The metadata table
  AbdomenAtlas3.0MiniWithMeta.csv has one row per scan, keyed by BDMAP ID. It holds voxel spacing, demographics where
  known, organ volumes, lesion counts, sizes, locations and attenuation, and the report texts. The folder TrainTestIDS
  holds two splits that each cover all 9,262 scans with no overlap: IID (8,336 train, 926 test; the random split the
  paper used) and OOD (4,696 train, 4,566 test, which keeps hospitals apart; not used in the paper). The array axis
  order is not the same in every file: in 450 rows the largest spacing value comes first, so read orientation from
  each file's header.
citation: >-
  Bassi PRAS, Yavuz MC, Hamamci IE, Er S, Chen X, Li W, Menze B, Decherchi S, Cavalli A, Wang K, Yang Y, Yuille A,
  Zhou Z. RadGPT: Constructing 3D Image-Text Tumor Datasets. Proceedings of the IEEE/CVF International Conference on
  Computer Vision (ICCV), 2025, pp. 23720–23730. doi:10.1109/ICCV51701.2025.02202. Preprint: arXiv:2501.04678.
limitations:
  - The kidney lesion mask does not say whether a lesion is a tumour or a cyst, although KiTS'23, one of the source datasets, labels the two separately; whether cysts are included is not documented.
  - The reports were generated from the masks by rules and a language model, then checked by radiologists; they are not the source hospitals' own reports.
  - The organ volumes and lesion values in the metadata table were read back out of the report text, not measured from the masks. A missing lesion count, size or volume was written as 0, so 0 also covers "not in the report" and "no report"; other missing values are left blank.
  - Sex and age are known for about 15% of scans, scanner vendor for about 5%, and contrast phase for 13% in the metadata table.
  - The scans are reused from public datasets, including KiTS23 and CT-ORG in this catalogue; counts must never be added to theirs.
  - The two licence statements (dataset card CC BY-NC-SA 4.0, repository CC BY-NC-ND 4.0) disagree.
