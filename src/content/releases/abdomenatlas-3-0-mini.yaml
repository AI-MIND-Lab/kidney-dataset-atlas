  - segmentation
  - report_generation
annotations:
  - segmentation_masks
annotationProvenance:
  kind: mixed
  note: >-
    Organ masks come from AbdomenAtlas 1.1, made by AI with radiologists in the loop. Lesion masks for the liver,
    kidney and pancreas were first drawn by AI (DiffTumor and nnU-Net) and then checked and corrected by radiologists,
    one by one. They added missed lesions and removed false ones, and used the source datasets' own ground truth where
    it existed; 12 board-certified radiologists took part. The masks of the vessels used for pancreatic tumour staging
    (celiac_aa, superior_mesenteric_artery and veins) came from an nnU-Net trained on private data and were revised by
    radiologists; the paper does not say where the other vessel files came from. Liver sub-regions came from an nnU-Net fine-tuned on 131 LiTS scans, and no
    revision is described. Pancreas head, body and tail were split by a fixed rule from a segmentation of the superior
    mesenteric artery, and radiologists judged them only qualitatively. The reports are written from these masks by rules and a
    language model, not by the source hospitals.
  evidence:
    sources: [radgpt-paper, radgpt-staging-script]
    locator: Abstract; Figure 2 caption; section 3.1.1 and footnote 1; section 4.2; Appendix C; staging.py type2name (file names of the CA/CHA, SMA and portal vein/SMV masks)
    status: verified
    verifiedOn: 2026-09-30
