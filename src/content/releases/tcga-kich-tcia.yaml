      status: verified
      verifiedOn: 2026-09-26
  deidentification:
    status: pass
    note: The archive describes its date-offset de-identification for this collection.
    evidence:
      sources: [tcia-tcga-kich]
      status: verified
      verifiedOn: 2026-09-26
  noPhiHosted:
    status: pass
  termsPermitUse:
    status: pass
    note: CC BY 3.0 permits reuse with attribution.
    evidence:
