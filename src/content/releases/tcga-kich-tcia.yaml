  records:
    value: null
    status: not_applicable
modalities:
  - ct
  - mri
cohort: >-
  Patients of the TCGA chromophobe renal cell carcinoma project whose clinical imaging was
  contributed to The Cancer Imaging Archive: 15 of the project's 113 cases.
tasks: []
annotations: []
annotationProvenance:
  kind: none
  note: >-
    The collection holds images only. RCC-AID, catalogued as its own dataset, adds
    student-corrected kidney, tumour and cyst masks for 18 CT scans from this collection. BAMF's
    AIMI annotation record (version 2.x) also lists this collection among its sources; those
    masks are AI output, a small part of it corrected by a radiologist.
  evidence:
    sources: [rcc-aid-paper, bamf-aimi-zenodo]
    locator: RCC-AID Table 2; BAMF Zenodo record, related identifiers (derived from doi:10.7937/K9/TCIA.2016.YU3RBCZN)
    status: verified
    verifiedOn: 2026-09-26
features:
  wsi:
    status: not_applicable
    note: Slides for these patients are in the GDC open-access release of this dataset.
  ctPhases:
    status: not_documented
    note: >-
      Contrast phases are not labelled in a structured field; the RCC-AID authors had a
      radiologist label phases for the scans they annotated.
    evidence:
      sources: [rcc-aid-paper]
      locator: Section 5.2.2, annotation protocol
      status: verified
      verifiedOn: 2026-09-26
  clinicalData:
    status: absent
    note: The archive states that clinical and genomic data are held in the GDC, not in this collection. They join by TCGA barcode.
    evidence:
      sources: [tcia-tcga-kich]
      status: verified
      verifiedOn: 2026-09-26
  followUp:
    status: absent
    note: Follow-up is in the GDC clinical records, not in this collection.
access:
  mode: direct_open_download
  registrationVisible: false
  instructions: >-
    Download from the collection page with the NBIA Data Retriever, or query the TCIA API. The
    images are also mirrored in NCI's Imaging Data Commons.
  evidence:
    sources: [tcia-tcga-kich]
    status: verified
    verifiedOn: 2026-09-26
license:
  name: CC BY 3.0
  url: https://creativecommons.org/licenses/by/3.0/
  conditions: >-
    Attribution: cite the collection (Linehan et al. 2016, doi:10.7937/K9/TCIA.2016.YU3RBCZN)
    and The Cancer Imaging Archive. The series list gives the same licence for every series.
deidentification:
  statement: >-
    The collection page states that DICOM dates are offset by a random number of days (3 to 10
    years earlier), keeping the intervals between studies, to protect patient privacy under
    HIPAA.
  status: present
  evidence:
    sources: [tcia-tcga-kich]
    locator: Collection page, de-identification note
    status: verified
    verifiedOn: 2026-09-26
pairing:
  - kind: same_patient
    modalities: [ct, pathology, clinical_table]
    status: present
    note: >-
      All 15 imaging patients are cases in the GDC open-access release of TCGA-KICH: the
      archive's PatientID is the TCGA barcode. 12 patients with CT also have slide images there.
    evidence:
      sources: [tcia-tcga-kich-series, gdc-kich-case-records, gdc-kich-slide-files]
      locator: PatientID values matched against GDC case submitter_id values
      status: verified
      verifiedOn: 2026-09-26
dictionary:
  completeness: documentation_only
  inspectedScope: >-
    The series-level fields returned by the TCIA API (PatientID, modality, manufacturer, series
    description, image count, licence). No DICOM header was read. The clinical dictionary is on
    the GDC release.
structure: >-
  DICOM organised as patient, study and series, one study per patient. The PatientID is the
  TCGA barcode, which joins each patient to the clinical records and slides in the GDC.
citation: >-
  Linehan MW, Gautam R, Sadow CA, Levine S. The Cancer Genome Atlas Kidney Chromophobe
  Collection (TCGA-KICH) (Version 3) [Data set]. The Cancer Imaging Archive, 2016.
  doi:10.7937/K9/TCIA.2016.YU3RBCZN
limitations:
  - Covers 15 of the 113 TCGA-KICH cases, and only 12 of them have CT.
  - Contrast phase is not labelled in a structured field.
  - No masks are part of the collection.
eligibility:
  publicAccess:
    status: pass
    note: Downloads without registration or application.
