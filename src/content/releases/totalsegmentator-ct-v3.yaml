structure: >-
  A single archive of about 37 GB, holding CT images with their segmentation masks. Both
  kidneys are among the segmented structures; the full label list travels with the archive.
citation: >-
  Wasserthal J, Breit H-C, Meyer MT, et al. TotalSegmentator: Robust Segmentation of 104
  Anatomic Structures in CT Images. Radiology: Artificial Intelligence, 2023.
  doi:10.1148/ryai.230024. Cite the dataset version DOI separately.
limitations:
  - An anatomical dataset, not a kidney disease cohort; kidney labels are outlines, not diagnoses.
  - The paper describes 104 structures in 1,204 examinations; this release holds 117 structures across 1,939 images.
  - Images are counted, not subjects, so the size of the cohort is unknown.
  - The archive is about 37 GB, which is not a casual download.
