annotationProvenance:
  kind: expert
  note: >-
    Each tumour was scored by three radiologists, randomly assigned from 13 fellowship-trained
    abdominal radiologists at seven institutions (7 to 16 years' experience), blinded to the
    clinical and mutational data, on a feature set the research group defined in consensus and
    practised on 11 training cases. The released table holds one value per feature; its counts
    match the paper's Table 1, which reports the summary values: the readers' median for size,
    necrosis and growth pattern, and the most common answer for margin, composition and
    calcification. The individual readers' scores are not released. Agreement between readers
    was very high for size (ICC 0.983), low for margin (Krippendorff's alpha 0.300) and
    inconclusive for the other features. Mutation status for the six genes came from cBioPortal.
  evidence:
    sources: [shinagare-2015, tcia-tcga-kirc-radiogenomics-csv]
    locator: Methods (image feature set development, image review, mutational status, statistical analysis); Results, inter-observer agreement; Table 1
    status: verified
    verifiedOn: 2026-10-09
