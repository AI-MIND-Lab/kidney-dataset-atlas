dictionary:
  completeness: complete_for_inspected_release
  inspectedScope: >-
    FullDataforAnalysis071714.csv, all 23 columns and 103 rows; meanings from the paper's methods
    and Table 1. The image manifest was matched against the TCIA series list; no image was
    downloaded.
structure: >-
  One CSV, one row per patient. An unnamed first column holds the TCGA barcode. Then come six
  mutation flags (BAP1, PBRM1, VHL, SETD2, KDM5C, MUC4; TRUE or FALSE), DaystoLastFollowup,
  Status, Age, Gender, HistGrade and Stage, and the imaging columns: AxisLength (tumour size),
  MultipleTumors, NumberLeftTumors, NumberRightTumors, Side, WellDefinedMargin,
  SolidComposition, Necrosis, Calcification and GrowthPattern. NA marks a value not assessed.
  The images are the TCGA-KIRC collection's DICOM series, listed in the page's manifest.
citation: >-
  Shinagare AB, Vikram R, Jaffe C, Akin O, Kirby J, Huang E, Freymann J, Sainani NI, Sadow CA,
  Bathala TK, Rubin DL, Oto A, Heller MT, Surabhi VR, Katabathina V, Silverman SG. (2014).
  Radiogenomics of Clear Cell Renal Cell Carcinoma: Preliminary Findings of The Cancer Genome
  Atlas-Renal Cell Carcinoma (TCGA-RCC) Research Group. The Cancer Imaging Archive.
  doi:10.7937/K9/TCIA.2014.K6M61GDW. Paper: Abdominal Imaging 40(6):1684–1692 (2015),
  doi:10.1007/s00261-015-0386-z.
limitations:
  - Each feature is one summary value of three readers; the individual scores are not released, and agreement was low for margin and inconclusive for composition, necrosis, growth pattern and calcification.
  - The table does not say which study or series was scored. TCIA's image list has both CT and MR series for 10 patients, while the paper reports both for 3.
  - Small cohort for genotype work, from the first patients on the TCGA portal rather than a random sample. Five patients have a BAP1 mutation and six KDM5C, and none of the paper's associations remained significant after correction for multiple testing.
  - Status, Side, MultipleTumors and the two tumour-count columns are not defined by the provider.
  - Not independent of TCGA-KIRC; its counts must not be added to the collection's.
