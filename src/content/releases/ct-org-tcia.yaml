  - segmentation
annotations:
  - segmentation_masks
annotationProvenance:
  kind: mixed
  note: >-
    Kidneys and the other organs apart from lungs and bones were segmented by hand in ITK-SNAP,
    in both splits. Lungs and bones were segmented automatically by morphological image
    processing in the 119-scan training set and manually in the 21-scan test set. Evaluating a
    kidney model against these masks means evaluating against manual work; the same is not true
    of every organ here.
  evidence:
    sources: [ct-org-tcia]
    locator: Mask production description
    status: verified
    verifiedOn: 2026-09-20
