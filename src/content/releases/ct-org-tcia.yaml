structure: >-
  CT series with organ masks, organised by subject in the archive's collection browser, split
  into 119 training and 21 test scans.
citation: >-
  Rister B, et al. CT-ORG, a new dataset for multiple organ segmentation in computed
  tomography. Scientific Data, 2020. doi:10.1038/s41597-020-00715-8. See the collection page
  for the archive's required citation.
limitations:
  - An anatomical dataset, not a kidney cohort; kidney masks are outlines, not diagnoses.
  - Mask production differs by organ and by split, so mask quality is not uniform across the collection.
  - Brain labels exist only in a subset of scans.
  - Source cohorts are mixed, so the collection is not an independent kidney-cancer cohort.
