structure: >-
  Each JSON file has a header, "training" and "validation" lists with one record per case, and an empty "testing" list.
  The header gives the name, description, author, reference, licence, release, contact, tensorImageSize, modality and
  the number of cases per split. A record gives the image path (./imagesTr/amos_xxxx.nii.gz or ./imagesVa/...), which is
  the case key, and "meta" with site, scanner, shape and spacing. The meta is the same in both files. In
  report_generation_train_val.json, "labels" holds the report: findings as one text per region (chest, abdomen, pelvis)
  and impression as a list of sentences per region. In vqa_train_val.json, "labels" holds "qa", a list of questions,
  each with four options (A to D), the answer letter, a reasoning text and one of 6 question types. The CTs are NIfTI
  files in two zips, and imagesTr.zip also holds 3 validation CTs.
citation: >-
  Ji Y, Ge C, Li R, Luo P. AMOS-MM: Abdominal Multimodal Analysis Challenge: Structured description of the challenge
  design. Zenodo, 2024. doi:10.5281/zenodo.10992155. The data page asks users of the AMOS data to cite: Ji Y et al.,
  AMOS: A Large-Scale Abdominal Multi-Organ Benchmark for Versatile Medical Image Segmentation, NeurIPS 2022
  (arXiv:2206.08023).
limitations:
  - The 400 test cases are announced but not released, so test results from the challenge cannot be reproduced.
  - The reports and questions cover the whole chest, abdomen and pelvis. Kidney findings appear only as free text, with no kidney masks or labels.
  - GPT-4 generated the questions from the reports. The design document names hallucination as the main source of error in the questions. These errors were corrected in review.
  - 228 CT files are AMOS22 files, and 152 of them are AbdomenAtlas 3.0 and DeepTumorVQA scans. Counts must never be added to theirs.
  - The licence is unresolved, because the JSON says CC BY-ND 4.0 and the design document says CC BY-SA.
