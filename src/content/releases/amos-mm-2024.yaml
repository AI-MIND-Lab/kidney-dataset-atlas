  - report_generation
  - other
annotations:
  - classification_labels
annotationProvenance:
  kind: mixed
  note: >-
    The reports are the hospitals' own. They were written in Chinese, translated into English by three junior
    radiologists (about 3 years of experience) and corrected by two senior radiologists (about 8 years). GPT-4 generated
    the questions, answers and reasoning from the reports. A senior radiologist and a clinical physician then reviewed
    what GPT-4 wrote. Only sets that passed review and need the image to be answered were kept. The design document
    names the "hallucination issues of ChatGPT" as the main source of error in writing the questions. No masks are
    released.
  evidence:
    sources: [amos-mm-design-doc]
    locator: Design document pp. 13 (report translation), 26 (question generation and review) and 27 (sources of error)
    status: verified
    verifiedOn: 2026-09-30
doi: null
access:
  mode: direct_open_download
  registrationVisible: false
  instructions: >-
    Download the four files from the public Google Drive folder linked on the AMOS data page: imagesTr.zip (59.6 GB),
    imagesVa.zip (19.1 GB), report_generation_train_val.json (4.1 MB) and vqa_train_val.json (16.6 MB). No sign-in or
    form is needed. During the challenge, the data were sent only after an application form was reviewed. The data page
    now links the folder directly.
  evidence:
    sources: [amos-mm-data-page, amos-mm-drive-folder, amos-mm-codabench]
    locator: Data page "Download" link; folder file list and download headers; Codabench "Dataset" page ("download links will be given to the participant after we review their submitted data request") and "Instructions" page
    status: verified
    verifiedOn: 2026-09-30
license:
  name: CC BY-ND 4.0 (JSON headers), but the design document says CC BY-SA
  url: https://creativecommons.org/licenses/by-nd/4.0/
  conditions: >-
    Both JSON files state "licence": "CC BY-ND 4.0". The design document instead says the challenge follows "the
    CC BY-SA (Attribution-ShareAlike) adopted by AMOS22" (pp. 8 and 22), and the data page states no licence. The 228
    CT files that are AMOS22 files are also covered by AMOS22's own terms, which disagree among themselves (see the
    quality findings). During the challenge, applicants had to promise on the application form to "obey the rules,
    NOT share the dataset". The Codabench rules let teams publish methods "provided they properly cite the challenge and
    dataset". The current Google Drive link asks for neither. Which terms apply is unresolved.
deidentification:
  statement: >-
    The design document states that the reports were collected "ensuring all personal information was anonymized" and
    that "Personally identifiable information has been carefully removed" (pp. 13-14). It also states that each case's
    clinical information "has been de-identified" (p. 12). In the 16 sample CT headers, the only free-text fields hold a
    time of day (for example "Time=85135.200") and sometimes a label such as "Venous_Phase". None holds a date or a
    name.
  status: present
  evidence:
    sources: [amos-mm-design-doc, amos-mm-image-files]
    locator: Design document pp. 12-14; descrip and aux_file fields of the 16 sample NIfTI headers
    status: verified
    verifiedOn: 2026-09-30
