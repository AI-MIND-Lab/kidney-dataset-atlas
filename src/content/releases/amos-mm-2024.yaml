cohort: >-
  CT scans of "positive cases (patients diagnosed with diseases)" from two hospitals in Shenzhen, China (design
  document, pp. 11-12). Site A is Longgang District Central Hospital, with 604 cases, and site B is Longgang District
  People's Hospital, with 1,083 cases. Site names come from the Codabench Dataset page and counts from the JSON. The
  JSON names 5 CT scanner models, plus 2 MRI models for 4 cases. The release has 1,287 training and 400 validation
  cases. The "other" modality is the report and question text.
