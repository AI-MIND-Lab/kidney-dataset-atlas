cohort: >-
  The 9,262 AbdomenAtlas 3.0 CT scans. The paper says they come from 17 public abdominal CT datasets, collected as
  11,995 scans with 2,733 excluded in quality control (Appendix a); the ID mapping on GitHub names more sources than
  that (see the quality findings). The "other" modality is the
  question-and-answer text. There are 428,050 training questions on 8,334 scans, a validation pool of 47,933 on
  1,158 scans (230 scans are in both), and a 10,000-question benchmark on 991 scans drawn from that pool.
