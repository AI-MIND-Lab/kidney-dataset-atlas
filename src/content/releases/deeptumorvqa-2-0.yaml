structure: >-
  Questions are in train/train_qa.csv, train/val_qa_pool.csv and benchmark/test_qa.json; test_qa.jsonl holds the same
  10,000 benchmark records. Compared with the CSV files, the two benchmark files add 5 fields (the tools an agent needs,
  and paths to images and videos) and have no split field.
  Each question row names its scan by BDMAP ID and repeats the scan's spacing, shape, sex, age and scanner; it holds
  the question, the answer, the multiple-choice version and the correct letter, the organ and lesion type asked
  about, and the question type (4) and subtype (42). metadata/reports_and_metadata.csv has one row per scan (9,257
  rows, 84 columns) with the measured values and the report texts. metadata/subtype_schema.csv describes the 42
  subtypes and metadata/leaderboard.csv the 38 paper results. For agents, tool_cache/ holds per-scan tool outputs
  (ground-truth and TotalSegmentator values for the 991 benchmark scans, ground-truth values for 283 training scans),
  and agent_sft/ holds 20,000 training and 20,000 held-out conversations on those 283 scans. Benchmark images and
  videos are in benchmark/images_2d/ and benchmark/videos/; the paths written in the question files use other folder
  names (see the quality findings).
citation: >-
  Chen Y, Xiao W, Bassi PRAS, Wang B, He L, Zhou X, Er S, Hamamci IE, Zhou Z, Yuille A. DeepTumorVQA: A Hierarchical
  3D CT Benchmark for Stage-Wise Evaluation of Medical VLMs and Tool-Augmented Agents. arXiv:2605.09679, 2026.
limitations:
  - All answers are generated by programs from a metadata table. They inherit its errors, including implausible typed-lesion diameters on 424 KiTS scans and "no kidney lesion" answers for kidneys with tumours or cysts (see the quality findings).
  - The benchmark is a subset of the validation pool, 230 scans are in both the training set and the validation pool, and at least 437 of the 991 benchmark scans have the same scan or patient in training, although the paper describes the split as having zero overlap.
  - The paper and the dataset card disagree on whether the masks behind the metadata are AbdomenAtlas's or were redrawn in-house.
  - The contrast column is empty everywhere (the phase is only in the report text, for 2,273 scans), and sex and age are known for about 15% of scans.
  - The questions are about the AbdomenAtlas 3.0 scans, which include, by the ID mapping on GitHub, 489 KiTS23, 64 CT-ORG, 485 TotalSegmentator and 62 CPTAC-CCRCC scans in this catalogue; counts must never be added to theirs.
