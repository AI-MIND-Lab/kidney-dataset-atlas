annotationProvenance:
  kind: mixed
  note: >-
    The answers are computed by programs, not written by people: one program per question type reads the per-scan
    metadata table and fills one of its sentence templates (paper, section 3.1, says 10; in the files 12 of the 42
    subtypes have only 3 to 5 wordings). The paper says the masks behind that table were
    drawn by 23 radiologists in 3D Slicer, with peer review and specialist adjudication, and that the only
    human-assigned attributes are the lesion types (cyst or tumour; PDAC or PNET) (Appendices b and s). The dataset
    card instead says the questions are generated from the AbdomenAtlas reports and masks. A 200-question subset was
    answered by two radiologists (card; paper, section 4.1). The masks themselves are not released.
  evidence:
    sources: [deeptumorvqa-paper, deeptumorvqa-hf-card]
    locator: Paper sections 3.1-3.2 and Appendices b and s; card, "Source data"
    status: verified
    verifiedOn: 2026-09-30
