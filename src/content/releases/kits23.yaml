dictionary:
  completeness: partial
  inspectedScope: >-
    The label configuration file in the dataset repository (kits23/configuration/labels.py) and
    the challenge page. The imaging itself was not downloaded.
    Subsequent additions use field names and encodings checked in dataset/kits23.json,
    with descriptions adapted from the supplied KiTS21 dictionary. Clinical meanings
    remain unverified; KiTS21 missing-instance counts were not cross-referenced and are omitted.
notes:
  - title: Additional KiTS23 information
    text: >-
      Public case IDs
      are case_00000 to case_00299 and case_00400 to case_00588.
      IDs case_00300 to case_00399 are absent from the public release; the reason for
      this numbering gap was not established from the sources checked.
      Before preprocessing, check every expected case for imaging.nii.gz and
      segmentation.nii.gz. If images are missing, retry the download or use the official
      Hugging Face imaging source linked in the README. Tumor label 2 indicates a mass
      suspected of malignancy, not a confirmed malignant diagnosis. The newer KiTS23
      annotation procedure differs from the inherited KiTS21 procedure; the precise
      aggregation of inherited masks requires case-level review.
    evidence:
      sources: [kits23-clinical-metadata, kits23-readme, kits23-challenge-page]
      locator: Metadata field names; README download instructions; The Data and annotation sections
      status: verified
      verifiedOn: 2026-10-07
structure: >-
  Each case directory in the repository holds segmentation.nii.gz together with an instances
  directory of individual annotation instances; the imaging volume is fetched separately by the
  download command. Cases are identified by a case number such as case_00000.
citation: >-
  Heller N, Isensee F, Trofimova D, et al. The KiTS21 Challenge: Automatic segmentation of
  kidneys, renal tumors, and renal cysts in corticomedullary-phase CT. arXiv:2307.01984, 2023.
  doi:10.48550/arXiv.2307.01984 — cited together with the KiTS23 challenge page,
  https://kits-challenge.org/kits23/. The KiTS21 report is the closest publication; no
  publication specific to the KiTS23 release was located, and the challenge organisers may
  request a different citation.
limitations:
  - The 110-case test set is not publicly available; only the 489 training cases are.
  - The KiTS21 publication reports roughly a 2:1 male-to-female imbalance in the cohort.
  - The KiTS21 publication describes the training cohort as drawn largely from a single academic centre and predominantly Caucasian.
  - Scanners and protocols vary, because many scans came from referring institutions.
  - Six segmentation classes were originally planned; three were released after quality assurance.
