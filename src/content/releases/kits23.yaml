cohort: >-
  KiTS19 / C4KC-KiTS: University of Minnesota patients who underwent partial or radical
  nephrectomy for renal tumours. KiTS21: the same 300 University of Minnesota patients as the full KiTS19 cohort,
  with new annotations, plus a separate 100-case test cohort from Cleveland Clinic.
  The papers report conflicting treatment periods for the shared Minnesota cohort
  (2010–mid-2018 in KiTS19 versus January 2011–June 2019 in KiTS21); this remains unresolved.
  KiTS23: M Health Fairview patients treated by cryoablation, partial nephrectomy or radical
  nephrectomy for suspected renal malignancy between 2010 and 2022, with contrast-enhanced
  preoperative CT covering all kidneys. 
tasks:
  - segmentation
annotations:
  - segmentation_masks
annotationProvenance:
  kind: trainee
  label: Trainee annotations, expert-reviewed as needed after baseline nnU-Net quality checks
  note: >-
    Trainees (residents, medical students and pre-medical undergraduates, trained by the experts)
    placed 3D bounding boxes and then 2D contours around each region, consulting experts when in
    doubt; the contours were post-processed into segmentations and reviewed by trainees. Unlike
    KiTS21, each region was annotated once. Experts (attending radiologists, urologic oncologists
    and fellows) further reviewed cases as needed when agreement between the reference labels
    and a baseline nnU-Net's cross-validation predictions was low.
  evidence:
    sources: [kits23-challenge-page]
    locator: Annotation section
    status: verified
    verifiedOn: 2026-09-24
