cohort: >-
  Patients treated for suspected renal malignancy by cryoablation, partial nephrectomy or
  radical nephrectomy at M Health Fairview medical centers between 2010 and 2022. The
  selected scan is the most recent contrast-enhanced preoperative CT covering all kidneys.
tasks:
  - segmentation
annotations:
  - segmentation_masks
annotationProvenance:
  kind: trainee
  note: >-
    Trainees (residents, medical students and pre-medical undergraduates, trained by the experts)
    placed 3D bounding boxes and then 2D contours around each region, consulting experts when in
    doubt; the contours were post-processed into segmentations and reviewed by trainees. Unlike
    KiTS21, the KiTS23 process delineates each region once. This describes the newer annotation
    procedure, not a claim that all inherited cases have only one annotation.
    Experts (attending radiologists, urologic oncologists
    and fellows) reviewed cases where a baseline nnU-Net disagreed with the labels.
  evidence:
    sources: [kits23-challenge-page]
    locator: Annotation section
    status: verified
    verifiedOn: 2026-09-24
