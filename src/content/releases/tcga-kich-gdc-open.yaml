    status: verified
    verifiedOn: 2026-09-20
license:
  name: NCI Genomic Data Commons open-access tier
  url: https://gdc.cancer.gov/access-data/data-access-processes-and-tools
  conditions: >-
    Open-access data are downloadable without authorisation. Publication and citation
    guidance from NCI applies. The controlled-access tier carries separate obligations and is
    excluded here.
deidentification:
  statement: >-
    The GDC describes open-access data as "high level genomic data that is not individually
    identifiable, as well as most clinical and all biospecimen data elements", and places
    individually identifiable data in the controlled tier.
  status: present
  evidence:
