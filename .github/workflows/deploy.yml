name: Deploy to GitHub Pages

# Manual start only: publishing the site is a deliberate step, not a side
# effect of pushing. The build publishes approved records only; drafts and
# fixtures fail the output check. GitHub Pages must be enabled in the
# repository settings (Source: GitHub Actions) before the first run.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Validate, build, index and check output
        run: npm run build
        env:
          SITE_URL: https://i-sababishraq.github.io
          BASE_PATH: /kidney-dataset-atlas
          SITE_PUBLIC: 'true'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
